<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0a0b0d" />
  <title>Сторінку не знайдено — RentCar UA</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #0a0b0d; color: #f7f6f2; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    a { color: inherit; text-underline-offset: .22em; }
    a:focus-visible { outline: 2px solid #fff; outline-offset: 4px; box-shadow: 0 0 0 6px #111; }
    header { position: absolute; inset: 0 0 auto; padding: 20px clamp(20px, 5vw, 64px); }
    .brand { font-family: 'Arial Narrow', Impact, sans-serif; font-size: 25px; letter-spacing: .08em; text-decoration: none; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 112px 20px 70px; overflow: hidden; position: relative; text-align: center; }
    .ghost { position: absolute; z-index: 0; font-family: Impact, 'Arial Narrow', sans-serif; font-size: clamp(170px, 42vw, 520px); line-height: .8; letter-spacing: .02em; color: rgba(255,255,255,.045); user-select: none; }
    .content { position: relative; z-index: 1; max-width: 650px; }
    .kicker { display: inline-flex; align-items: center; gap: 12px; color: #e0bd78; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; }
    .kicker::before, .kicker::after { content: ''; width: 22px; height: 1px; background: #c89b4a; }
    h1 { margin: 24px 0; font-family: 'Arial Narrow', Impact, sans-serif; font-size: clamp(44px, 9vw, 84px); font-weight: 500; line-height: .92; text-transform: uppercase; }
    p { max-width: 460px; margin: 0 auto; color: #b5b3ae; line-height: 1.65; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 32px; }
    .button { min-height: 48px; display: inline-flex; align-items: center; justify-content: center; padding: 0 22px; border: 1px solid #c89b4a; text-decoration: none; font-size: 14px; font-weight: 600; }
    .primary { background: #c89b4a; color: #0a0b0d; }
    .secondary { color: #f7f6f2; border-color: rgba(255,255,255,.28); }
    footer { padding: 0 20px 26px; color: #85837e; font-size: 12px; text-align: center; }
    @media (prefers-reduced-motion: no-preference) { .button { transition: background .2s ease, color .2s ease; } .primary:hover { background: #e0bd78; } .secondary:hover { border-color: #fff; } }
  </style>
</head>
<body>
  <header><a class="brand" href="/">RENTCAR</a></header>
  <main>
    <span class="ghost" aria-hidden="true">404</span>
    <section class="content" aria-labelledby="not-found-title">
      <span class="kicker">Помилка 404</span>
      <h1 id="not-found-title">Цього маршруту<br />не існує</h1>
      <p>Сторінку не знайдено. Перейдіть на головну або відкрийте каталог автомобілів.</p>
      <nav class="actions" aria-label="Наступні кроки">
        <a class="button primary" href="/">На головну</a>
        <a class="button secondary" href="/Inventory.html">Каталог авто</a>
      </nav>
    </section>
  </main>
  <footer>RentCar UA</footer>
</body>
</html>
