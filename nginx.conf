limit_req_zone $binary_remote_addr zone=api_general:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=booking_write:10m rate=8r/m;
limit_req_status 429;

server {
    listen 80;
    server_name localhost;
    server_tokens off;
    client_max_body_size 32k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 15s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip стиснення
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # The public booking endpoints have a tighter per-IP request budget.
    location ^~ /api/v1/bookings {
        limit_req zone=api_general burst=40 nodelay;
        limit_req zone=booking_write burst=4 nodelay;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        proxy_pass http://rentcar-python-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 1. Маршрутизація до PHP мікросервісу документів та оплат
    location ~ ^/api/v1/(documents|payments) {
        proxy_pass http://rentcar-php-service:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Маршрутизація до Python Core API (каталог, тарифи, бронювання, доступність)
    location /api/ {
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass http://rentcar-python-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Кешування статичних медіа-файлів (відео, фото)
    location ~* \.(mp4|webm|jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # 4. Кешування скриптів і стилів
    location ~* \.(css|js|jsx)$ {
        expires 1d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location ~ ^/(backend-python|backend-php|scripts|\.git|\.netlify)(/|$) { return 404; }
    location ~ /\.(?!well-known) { deny all; }

    # Legacy public aliases use HTTP redirects so crawlers and clients need not
    # download an HTML shell or execute JavaScript just to reach the real page.
    location = /about.html { return 301 /About.html; }
    location = /catalog.html { return 301 /Inventory.html; }
    location = /booking.html { return 301 /Service.html; }
    location = /tariffs.html { return 301 /Financing.html; }
    location = /auto.html { return 301 /Vehicle.html$is_args$args; }
    location = /Veloce.html { return 301 /; }

    # 5. Клієнтська навігація
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
